# Variation: P12 + F2 turn10 + A4 (Evidence Gap all turns)
# Base: v_p12_f2_turn10 ; adds evidence gap in ALL turns
# Rounds 1-9: general evidence gap → doctor_q_evidence_agent
# Rounds 10+: differential evidence gap → doctor_q_diff_evidence_agent
# Both evidence gap agents receive dialog (not summary)

name: v_p12_f2_turn10_A4
description: "P12 + F2 turn10 base with evidence gap in all turns (general early, differential late)"
workflow_type: dialog_only_diff

agents:
  - patient_agent
  - doctor_q_agent
  - doctor_q_evidence_agent
  - doctor_q_diff_agent
  - doctor_q_diff_evidence_agent
  - evidence_gap_agent
  - diagnosis_dialog_agent
  - judge_agent

max_rounds: 20
high_confidence_threshold: 95

# Prompt flags (best prompt config from P experiments)
pass_turn_info: true
ask_demographics_first: true
pass_reasoning_to_diff: true
pass_asked_questions: false

# Flow flags
diff_start_round: 10

# Evidence gap - all turns
use_evidence_gap: true
use_early_evidence_gap: true
eg_start_round: 10
early_eg_start_round: 3
use_dialog_for_evidence_gap: true


# Per-agent model overrides. Uncomment and edit to swap individual agents off
# the default (gpt-4o on OpenAI). patient_agent and judge_agent are intentionally
# omitted as they are not part of the evaluation — keep them on the default model.
