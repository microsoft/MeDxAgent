# Variation: P12 + F2 turn10 + A3 (Knowledge Graph)
# Base: v_p12_f2_turn10 ; adds KG-integrated diagnosis from round 10
# Structured summary runs every round (for symptom extraction only)
# Diagnosis uses dialog (not summary) via merge_dialog prompt

name: v_p12_f2_turn10_A3
description: "P12 + F2 turn10 base with Knowledge Graph integration from round 10"
workflow_type: dialog_only_diff

agents:
  - patient_agent
  - doctor_q_agent
  - doctor_q_diff_agent
  - summarizer_str_agent
  - diagnosis_dialog_agent
  - diagnosis_kb_agent
  - diagnosis_merge_agent
  - judge_agent

max_rounds: 20
high_confidence_threshold: 95

# Prompt flags (best prompt config from P experiments)
pass_turn_info: true
ask_demographics_first: true
pass_reasoning_to_diff: true
pass_asked_questions: false

# Flow flags
diff_start_round: 10

# Knowledge Graph
use_knowledge_graph: true
kg_start_round: 10
use_dialog_for_merge: true
use_dialog_for_kb: true


# Per-agent model overrides. Uncomment and edit to swap individual agents off
# the default (gpt-4o on OpenAI). patient_agent and judge_agent are intentionally
# omitted as they are not part of the evaluation — keep them on the default model.
