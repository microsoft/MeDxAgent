# Variation: P12 + F2 turn10 + A1a (paragraph summary)
# Base: v_p12_f2_turn10 ; adds paragraph summarizer + diagnosis from summary

name: v_p12_f2_turn10_A1a
description: "P12 + F2 turn10 base with paragraph summary agent"
workflow_type: differential_diagnosis

agents:
  - patient_agent
  - doctor_q_agent
  - doctor_q_diff_agent
  - summarizer_agent
  - diagnosis_summary_agent
  - judge_agent

max_rounds: 20
high_confidence_threshold: 95

# Prompt flags (best prompt config from P experiments)
pass_turn_info: true
ask_demographics_first: true
pass_reasoning_to_diff: true
pass_asked_questions: false

# Flow flags
diff_start_round: 10

# Summary config (W6 defaults to structured; override to paragraph)
summary_type: default


# Per-agent model overrides. Uncomment and edit to swap individual agents off
# the default (gpt-4o on OpenAI). patient_agent and judge_agent are intentionally
# omitted as they are not part of the evaluation — keep them on the default model.
