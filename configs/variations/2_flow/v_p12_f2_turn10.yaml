# Variation: P12 + F2 turn10 (Differential Q from round 10)
# Base: v_p12 ; with the differential question agent active from round 10 onward (diagnosis reasoning passed in).
# This is the canonical F2 base used by all agent-level (A*) variants and by MeDxAgent.

name: v_p12_f2_turn10
description: "P12 base + F2 (differential Q from round 10, with diagnosis reasoning)"
workflow_type: dialog_only_diff

agents:
  - patient_agent
  - doctor_q_agent
  - doctor_q_diff_agent
  - diagnosis_dialog_agent
  - judge_agent

max_rounds: 20
high_confidence_threshold: 95

# Prompt flags (best prompt config from P experiments)
pass_turn_info: true
ask_demographics_first: true
pass_reasoning_to_diff: true
pass_asked_questions: false

# Flow flags
diff_start_round: 10


# Per-agent model overrides. Uncomment and edit to swap individual agents off
# the default (gpt-4o on OpenAI). patient_agent and judge_agent are intentionally
# omitted as they are not part of the evaluation — keep them on the default model.
# agent_models:
