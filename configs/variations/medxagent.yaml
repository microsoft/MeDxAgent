# MeDxAgent — the full system
# Combines all agent-level additions on top of the P12 + F2 turn10 base:
# - A1a: paragraph summary for diagnosis/merge/evidence gap agents
# - A2:  specialist ensemble (10 specialists)
# - A3:  knowledge graph integration
# - A4:  evidence gap in all turns (general early, differential late)
#
# Flow:
# Rounds 1-2: doctor_q_agent + summarizer + diagnosis_dialog_agent (early stopping)
# Rounds 3-9: doctor_q_evidence_agent (general gap guided) + summarizer
#             + diagnosis_dialog_agent (early stopping) + general evidence gap
# Rounds 10-20: doctor_q_diff_evidence_agent + summarizer
#              + 10x specialist ensemble (paragraph) → ensemble merge
#              + KB lookup → KB diagnosis → merge (paragraph)
#              + differential evidence gap
#
# Per-agent model overrides can be set in the agent_models section at the bottom (currently commented out)

name: medxagent
description: "MeDxAgent: full system combining paragraph summary, specialist ensemble, knowledge graph, and evidence gap"
workflow_type: super_agent_specialist_kb

agents:
  - patient_agent
  - doctor_q_agent
  - doctor_q_evidence_agent
  - doctor_q_diff_evidence_agent
  - summarizer_agent
  - summarizer_str_agent
  - diagnosis_dialog_agent
  - diagnosis_summary_agent
  - specialist_ensemble_agent
  - diagnosis_kb_agent
  - diagnosis_merge_agent
  - evidence_gap_agent
  - judge_agent

max_rounds: 20
high_confidence_threshold: 95

# Prompt flags
pass_turn_info: true
ask_demographics_first: true
pass_reasoning_to_diff: true
pass_asked_questions: false

# Flow flags
diff_start_round: 10

# Early evidence gap
early_eg_start_round: 3

# Paragraph summary for diagnosis/merge/evidence gap agents
use_paragraph_summary: true

# Summary config
summary_type: default

use_knowledge_graph: true

# Qualitative print mode: print full per-agent outputs each round (for paper traces). Set to false for normal evaluation runs.
# qualitative_print: true

# Per-agent model overrides. All diagnostic / dialog agents can be changed.
# patient_agent and judge_agent are kept default (gpt-4o) as they are not part of the evaluation.
